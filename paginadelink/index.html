<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Links</title>
    <link rel="stylesheet" href="style.css">
    <!--  FAVICON DE CEREJA NA ABA DO NAVEGADOR -->
    
    <!-- Ícones FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Fonte Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>

<body>

    <main class="links-container">

        <!-- Perfil -->
        <header class="profile-header">
            <div class="profile-avatar">
                <img src="Assets/image.png" alt="Foto de Perfil">
            </div>
            <h1 class="profile-name">seu nome</h1>
            <p class="profile-bio">uma breve descrição ✨</p>
            <div class="highlight-pill"></div>
        </header>

        <!-- Cards com Imagens de Fundo -->
        <section class="links-list">

            <!-- Card 1: YouTube -->
            <a href="#" target="_blank"
                class="link-card card-youtube">
                <div class="card-overlay"></div>
                <div class="card-content">
                    <i class="fa-brands fa-youtube card-icon"></i>
                    <span class="card-text">Meu YouTube</span>
                </div>
            </a>

            <!-- Card 2: Instagram -->
            <a href="https://www.instagram.com/moonplayer_studio?stkn=a29wYXo0MGtuN3My" target="_blank"
                class="link-card card-instagram">
                <div class="card-overlay"></div>
                <div class="card-content">
                    <i class="fa-brands fa-instagram card-icon"></i>
                    <span class="card-text">Meu Instagram</span>
                </div>
            </a>

            <!-- Card 3: TikTok -->
            <a href="#" target="_blank"
                class="link-card card-tiktok">
                <div class="card-overlay"></div>
                <div class="card-content">
                    <i class="fa-brands fa-tiktok card-icon"></i>
                    <span class="card-text">Meu TikTok</span>
                </div>
            </a>

            <!-- Card 4: Entre em Contato -->
            <a href="#" target="_blank"
                class="link-card card-contato">
                <div class="card-overlay"></div>
                <div class="card-content">
                    <i class="fa-solid fa-envelope card-icon"></i>
                    <span class="card-text">Entre em contato</span>
                </div>
            </a>

            <!-- Card: Blog -->
            <a href="index.html" target="_blank" class="link-card card-blog">
                <div class="card-overlay"></div>
                <div class="card-content">
                    <i class="fa-solid fa-blog card-icon"></i>
                    <span class="card-text">Meu Blog</span>
                </div>
            </a>

        </section>

        <hr class="divider">

        <!-- Rodapé -->
        <footer class="footer-section">
            <div class="social-icons">
                <a href="#" target="_blank" class="social-box"><i
                        class="fa-brands fa-youtube"></i></a>
                <a href="https://www.instagram.com/moonplayer_studio?stkn=a29wYXo0MGtuN3My" target="_blank"
                    class="social-box"><i class="fa-brands fa-instagram"></i></a>
                <a href="#" target="_blank"
                    class="social-box"><i class="fa-brands fa-tiktok"></i></a>
                <a href="#" target="_blank"
                    class="social-box" title="E-mail">
                    <i class="fa-solid fa-envelope"></i>
                </a>
            </div>

            <!-- Texto de Direitos Autorais no Rodapé -->
            <p class="copyright-text">© 2026 seu nome. Todos os direitos reservados.</p>
        </footer>

    </main>

</body>

</html>
